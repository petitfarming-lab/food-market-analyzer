<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학교급식 시장규모 대시보드</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --navy:#1F4E79; --blue:#2E75B6; --lblue:#D6E4F0;
  --orange:#E8A838; --green:#4CAF50; --red:#E74C3C;
  --bg:#F4F7FB;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:var(--bg);color:#222;font-size:14px;}

/* ── 헤더 ── */
.hdr{background:var(--navy);padding:8px 20px;display:flex;align-items:center;gap:16px;
     position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.35);}
.hdr-logo{color:#fff;font-size:1.15rem;font-weight:700;white-space:nowrap;}
.hdr-logo span{color:var(--orange);}
.srch-box{display:flex;gap:8px;flex:1;max-width:620px;}
.srch-box input{flex:1;padding:5px 12px;border-radius:6px;border:none;font-size:.88rem;}
.srch-box input#kw-ex{flex:.7;}
.srch-box input#kw-ex::placeholder{color:#b91c1c;opacity:.6;}
.srch-box input:focus{outline:2px solid var(--orange);}
.srch-box button{padding:5px 16px;background:var(--orange);color:#fff;border:none;
  border-radius:6px;font-weight:700;cursor:pointer;font-size:.85rem;}
.srch-box button:hover{background:#c98a20;}
.pills{display:flex;gap:6px;flex-wrap:wrap;}
.pill{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);
  padding:3px 6px 3px 11px;border-radius:20px;font-size:.78rem;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:4px;}
.pill:hover{background:rgba(255,255,255,.25);}
.pill-kw{cursor:pointer;}
.pill-del{background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;
  font-size:.72rem;line-height:1;padding:1px 3px;border-radius:50%;transition:.15s;}
.pill-del:hover{color:#fff;background:rgba(255,255,255,.25);}

/* ── 상태 페이지 ── */
.state-page{padding:80px 20px;text-align:center;}
.state-page .icon{font-size:3.5rem;margin-bottom:14px;}
.state-page h2{color:var(--navy);font-size:1.5rem;margin-bottom:8px;}
.state-page p{color:#888;}
.spin{width:52px;height:52px;border:5px solid var(--lblue);border-top-color:var(--blue);
  border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 18px;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-kw{color:var(--blue);font-size:1rem;font-weight:700;}
.loading-sub{color:#aaa;font-size:.82rem;margin-top:5px;}
.btn-run{background:var(--orange);color:#fff;border:none;padding:9px 24px;
  border-radius:6px;font-weight:700;cursor:pointer;font-size:.93rem;margin-top:4px;}
.btn-run:hover{background:#c98a20;}
.btn-run:disabled{opacity:.5;cursor:not-allowed;}

/* ── 대시보드 ── */
#pg-dash{padding:10px 20px;}

/* KPI 카드 */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;}
.kpi{background:#fff;border-radius:8px;padding:10px 14px;
  box-shadow:0 1px 5px rgba(0,0,0,.08);border-top:3px solid var(--blue);}
.kpi.k2{border-top-color:var(--orange);}
.kpi.k3{border-top-color:var(--green);}
.kpi.k4{border-top-color:#9C27B0;}
.kpi-lbl{font-size:.68rem;color:#888;font-weight:700;text-transform:uppercase;margin-bottom:2px;}
.kpi-val{font-size:1.15rem;font-weight:700;color:var(--navy);}
.kpi-sub{font-size:.68rem;color:#aaa;margin-top:1px;}

/* 탭 */
.tabs{display:flex;margin-bottom:0;}
.tab{padding:7px 18px;cursor:pointer;font-weight:700;font-size:.85rem;color:#999;
  border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab.on{color:var(--navy);border-bottom-color:var(--navy);}
.tab:hover{color:var(--blue);}
.panel{display:none;}
.panel.on{display:block;}

/* 카드 박스 */
.box{background:#fff;border-radius:8px;padding:10px 14px;
  box-shadow:0 1px 5px rgba(0,0,0,.08);margin-bottom:10px;}
.box-title{font-size:.85rem;font-weight:700;color:var(--navy);margin-bottom:8px;}
.ch-wrap{position:relative;}

/* 엑셀과 동일한 테이블 */
.xl-tbl{width:100%;border-collapse:collapse;font-size:.82rem;}
.xl-tbl th{background:var(--navy);color:#fff;padding:8px 10px;text-align:center;
  font-weight:700;white-space:nowrap;border:1px solid #1a3f63;}
.xl-tbl td{padding:6px 10px;border:1px solid #ddd;text-align:right;white-space:nowrap;}
.xl-tbl td.c{text-align:center;}
.xl-tbl td.l{text-align:left;}
.xl-tbl tr.vac td{background:#E8F0FE;color:#777;}
.xl-tbl tr.best td{font-weight:700;}
.xl-tbl tr.best .mc::after{content:" ★";color:var(--orange);}
.xl-tbl tr.sum td{background:#EBF5E1;font-weight:700;}
.up{color:#2E7D32;font-weight:700;}
.dn{color:#C62828;font-weight:700;}
.tbl-wrap{overflow-x:auto;}

/* 시장규모 */
.mkt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.mkt-card{background:#fff;border-radius:10px;padding:18px;box-shadow:0 1px 5px rgba(0,0,0,.08);}
.mkt-card h6{font-size:.85rem;font-weight:700;color:var(--navy);margin-bottom:12px;
  padding-bottom:8px;border-bottom:2px solid var(--lblue);}
.mkt-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed #eee;}
.mkt-row:last-child{border:none;}
.mkt-num{width:22px;height:22px;background:var(--navy);color:#fff;border-radius:50%;
  font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mkt-desc{flex:1;font-size:.8rem;color:#555;}
.mkt-desc small{color:#aaa;font-size:.72rem;display:block;}
.mkt-val{font-size:.92rem;font-weight:700;color:var(--navy);text-align:right;}
.mkt-yoy{font-size:.72rem;margin-left:6px;}

/* 경쟁사 히트맵 */
.heat-pink{background:#FCE4EC !important;}
.heat-cell{transition:.15s;}

/* 제품 카드 */
.prod-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
.prod-card{background:#fff;border-radius:10px;padding:14px;
  box-shadow:0 1px 5px rgba(0,0,0,.08);}
.prod-card.r1{border-top:4px solid #FF6B35;}
.prod-card.r2{border-top:4px solid #FF9500;}
.prod-card.r3{border-top:4px solid #4CAF50;}
.prod-card.r4{border-top:4px solid #2196F3;}
.prod-card.r5{border-top:4px solid #9C27B0;}
.prod-rank{font-size:.72rem;font-weight:700;color:#aaa;margin-bottom:4px;}
.prod-img{background:var(--bg);border-radius:6px;height:72px;display:flex;
  align-items:center;justify-content:center;color:#ccc;font-size:.75rem;margin-bottom:8px;}
.prod-co{font-size:.95rem;font-weight:700;color:var(--navy);margin-bottom:3px;}
.prod-nm{font-size:.78rem;color:#666;margin-bottom:8px;min-height:32px;}
.prod-row{display:flex;justify-content:space-between;padding:3px 0;
  border-top:1px solid #f0f0f0;font-size:.77rem;}
.prod-k{color:#aaa;}
.prod-v{font-weight:600;color:var(--navy);}
.badge-d{background:#E8F5E9;color:#2E7D32;padding:1px 7px;border-radius:10px;font-size:.72rem;font-weight:600;}
.badge-i{background:#FFE0E0;color:#C00000;padding:1px 7px;border-radius:10px;font-size:.72rem;font-weight:600;}

/* 출처 */
.src-note{font-size:.72rem;color:#aaa;font-style:italic;margin-top:8px;}

@media(max-width:900px){.kpi-row{grid-template-columns:1fr 1fr;}.mkt-grid{grid-template-columns:1fr;}.prod-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.kpi-row{grid-template-columns:1fr;}.prod-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<!-- 헤더 -->
<header class="hdr">
  <div>
    <div class="hdr-logo">🍱 학교급식 <span>시장규모</span></div>
    <div style="color:rgba(255,255,255,.45);font-size:.68rem;margin-top:1px;letter-spacing:.3px;">v1.1 · 2026-06-10</div>
  </div>
  <div class="srch-box">
    <input id="kw" type="text" placeholder="검색 키워드 (폭립, 새우만두, 떡볶이 …)"
           onkeydown="if(event.key==='Enter')doSearch()">
    <input id="kw-ex" type="text" placeholder="검색제외 키워드 (선택)"
           onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">🔍 검색</button>
  </div>
  <div class="pills" id="pills"></div>
</header>

<!-- 홈 -->
<div class="state-page" id="pg-home">
  <div class="icon">📊</div>
  <h2>학교급식 시장규모 대시보드</h2>
  <p style="margin-top:8px;"><strong>2025년 vs 2024년</strong> 데이터를 기준으로 분석합니다.<br>
  캐시 데이터가 없으면 FoodnBid에서 2025·2024년 데이터를 자동 수집합니다.</p>
</div>

<!-- 로딩 -->
<div class="state-page" id="pg-load" style="display:none">
  <div class="spin"></div>
  <div class="loading-kw" id="load-kw"></div>
  <div class="loading-sub" id="load-sub"></div>
</div>

<!-- 없음 -->
<div class="state-page" id="pg-none" style="display:none">
  <div class="icon">🔍</div>
  <h2 id="none-title">데이터 없음</h2>
  <p id="none-msg" style="margin:8px 0 18px;"></p>
  <button class="btn-run" id="btn-run" onclick="runSkill()">⚡ FoodnBid 수집 시작</button>
</div>

<!-- 대시보드 -->
<div id="pg-dash" style="display:none">

  <!-- KPI -->
  <div class="kpi-row" id="kpi"></div>

  <!-- 탭 + 재수집 버튼 -->
  <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--lblue);margin-bottom:10px;">
    <div class="tabs" style="border:none;margin:0;">
      <div class="tab on"  onclick="swTab(0)">📊 학교급식 월별실측</div>
      <div class="tab"     onclick="swTab(1)">📈 시장규모 환산</div>
      <div class="tab"     onclick="swTab(2)">🏆 경쟁사 월별현황</div>
      <div class="tab"     onclick="swTab(3)">🛒 경쟁사 제품비교</div>
    </div>
    <div style="display:flex;gap:6px;margin-right:4px;">
      <button id="btn-excel" onclick="dlExcel()"
        style="padding:5px 14px;background:#1F7A3A;color:#fff;
               border:none;border-radius:6px;font-weight:700;
               font-size:.8rem;cursor:pointer;white-space:nowrap;">
        📥 엑셀 다운로드
      </button>
      <button id="btn-recollect" onclick="reCollect()"
        style="padding:5px 14px;background:#fff;color:var(--navy);
               border:1.5px solid var(--navy);border-radius:6px;font-weight:700;
               font-size:.8rem;cursor:pointer;white-space:nowrap;">
        🔄 재수집
      </button>
    </div>
  </div>

  <!-- ── 탭0: 월별실측 ── -->
  <div class="panel on" id="p0">
    <div class="box" style="padding:0;overflow:hidden;">
      <div class="tbl-wrap"><table class="xl-tbl" id="tbl0">
        <thead id="th0"></thead><tbody id="tb0"></tbody>
      </table></div>
    </div>
    <div class="src-note" id="y26-note" style="margin:-6px 0 8px;"></div>
    <div class="box">
      <div class="box-title" id="ch0-title"></div>
      <div class="ch-wrap"><canvas id="ch0" style="height:160px"></canvas></div>
      <div class="src-note" id="ch0-src"></div>
    </div>
  </div>

  <!-- ── 탭1: 시장규모 ── -->
  <div class="panel" id="p1">
    <div class="mkt-grid" id="mkt-grid"></div>
    <div class="box">
      <div class="box-title">연도별 시장규모 비교</div>
      <div class="ch-wrap"><canvas id="ch1" style="height:180px"></canvas></div>
    </div>
  </div>

  <!-- ── 탭2: 경쟁사 현황 ── -->
  <div class="panel" id="p2">
    <div style="display:grid;grid-template-columns:320px 1fr;gap:14px;margin-bottom:14px;">
      <div class="box">
        <div class="box-title">연간 점유율 TOP10</div>
        <div class="ch-wrap"><canvas id="ch2" style="height:200px"></canvas></div>
      </div>
      <div class="box" style="padding:0;overflow:hidden;">
        <div class="tbl-wrap"><table class="xl-tbl" id="tbl2s">
          <thead><tr>
            <th>순위</th><th>업체명</th><th>연간 합계 (원)</th>
            <th>점유율</th><th>방학제외 월평균 (원)</th>
          </tr></thead>
          <tbody id="tb2s"></tbody>
        </table></div>
      </div>
    </div>
    <div class="box" style="padding:0;overflow:hidden;">
      <div style="padding:12px 14px 6px;font-weight:700;font-size:.88rem;color:var(--navy);">
        경쟁사 월별 낙찰현황
        <span style="font-size:.73rem;color:#aaa;font-weight:400;margin-left:8px;">
          ※ 분홍색 셀 = 해당 월 1위 낙찰사
        </span>
      </div>
      <div class="tbl-wrap"><table class="xl-tbl" id="tbl2m">
        <thead id="th2m"></thead><tbody id="tb2m"></tbody>
      </table></div>
    </div>
  </div>

  <!-- ── 탭3: 제품비교 ── -->
  <div class="panel" id="p3">
    <div id="bluesis-banner" style="display:none;border-radius:8px;padding:10px 16px;
      margin-bottom:10px;font-size:.83rem;align-items:center;gap:10px;">
      <span id="bluesis-spin" style="display:inline-block;width:13px;height:13px;
        border:2px solid currentColor;border-top-color:transparent;
        border-radius:50%;animation:spin .9s linear infinite;flex-shrink:0;opacity:.7;"></span>
      <span id="bluesis-banner-txt"></span>
    </div>
    <div id="prod-sec"></div>
  </div>

</div><!-- /pg-dash -->

<script>
let G = null, curKw = '', curExclude = '', pollTmr = null, bluesisTmr = null;
let ch0 = null, ch1 = null, ch2 = null;

const $ = id => document.getElementById(id);
const fmt  = n => n ? n.toLocaleString('ko-KR') : '0';
const fmtW = n => n ? n.toLocaleString('ko-KR') + '원' : '—';
const fmtE = n => n ? (n/1e8).toFixed(2) + '억원' : '—';
const fmtE1= n => n ? (n/1e8).toFixed(1) + '억원' : '—';
const yoyStr = v => v === null || v === undefined ? '—'
  : `<span class="${v>=0?'up':'dn'}">${v>=0?'▲':'▼'}${Math.abs(v).toFixed(1)}%</span>`;

// ── 검색 히스토리 (localStorage) ────────────────────────
const HIST_KEY = 'schfood_hist';
const HIST_MAX = 12;

function getHist() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch { return []; }
}
function saveHist(arr) { localStorage.setItem(HIST_KEY, JSON.stringify(arr)); }

function pushHist(kw) {
  const h = getHist().filter(k => k !== kw);
  h.unshift(kw);
  saveHist(h.slice(0, HIST_MAX));
  renderPills();
}

function delHist(kw) {
  saveHist(getHist().filter(k => k !== kw));
  renderPills();
}

function clearHist() {
  saveHist([]);
  renderPills();
}

function renderPills() {
  const h = getHist();
  const box = $('pills');
  if (!h.length) { box.innerHTML = ''; return; }
  box.innerHTML = h.map(kw =>
    `<div class="pill" data-kw="${kw}">
       <span class="pill-kw">${kw}</span>
       <button class="pill-del" data-del title="삭제">✕</button>
     </div>`
  ).join('');
}

// 이벤트 위임: 클릭 한 번으로 검색 or 삭제
document.addEventListener('DOMContentLoaded', () => {
  renderPills();
  $('pills').addEventListener('click', e => {
    const pill = e.target.closest('[data-kw]');
    if (!pill) return;
    const kw = pill.dataset.kw;
    if (e.target.closest('[data-del]')) delHist(kw);
    else qs(kw);
  });
});

function qs(kw) {
  $('kw').value = kw;
  doSearch();
}

// ── 검색 ────────────────────────────────────────────────
async function doSearch() {
  const kw = $('kw').value.trim();
  if (!kw) { alert('키워드를 입력하세요.'); return; }
  curKw = kw;
  curExclude = $('kw-ex').value.trim();
  showPage('load');
  $('load-kw').textContent = `"${kw}" 2025·2024년 데이터 확인 중…`;
  $('load-sub').textContent  = '캐시 데이터를 조회합니다.';

  try {
    const r = await fetch(`/api/search?keyword=${encodeURIComponent(kw)}`);
    if (r.ok) {
      G = await r.json();
      pushHist(kw);
      render(); showPage('dash');
      if (G.bluesis_collecting) startBluesisPoll(kw);
    } else {
      const e = await r.json();
      showNone(kw, e.message || '데이터가 없습니다.');
    }
  } catch(e) { showNone(kw, '서버 오류. dashboard.py가 실행 중인지 확인하세요.'); }
}

// ── 블루시스 자동 수집 폴링 (로컬 전용) ──────────────────
function startBluesisPoll(kw) {
  if (bluesisTmr) clearInterval(bluesisTmr);
  showBluesisBanner('collecting');
  bluesisTmr = setInterval(async () => {
    try {
      const st = await (await fetch(`/api/bluesis_status?keyword=${encodeURIComponent(kw)}`)).json();
      if (st.status === 'done' && st.data) {
        clearInterval(bluesisTmr); bluesisTmr = null;
        if (kw === curKw) { G = st.data; renderProd(); }
        showBluesisBanner('done');
        setTimeout(() => showBluesisBanner('hide'), 5000);
      } else if ((st.status||'').startsWith('error') || st.status === 'unavailable') {
        clearInterval(bluesisTmr); bluesisTmr = null;
        showBluesisBanner('hide');
      }
    } catch(e) {}
  }, 8000);
}

function showBluesisBanner(mode) {
  const el = $('bluesis-banner');
  const sp = $('bluesis-spin');
  const tx = $('bluesis-banner-txt');
  if (!el) return;
  if (mode === 'hide') { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  if (mode === 'collecting') {
    el.style.cssText += ';background:#E3F2FD;border:1px solid #90CAF9;color:#1565C0;';
    sp.style.display = 'inline-block';
    tx.textContent = '블루시스에서 원재료·규격 자동 수집 중… (약 1~2분)';
  } else {
    el.style.cssText += ';background:#E8F5E9;border:1px solid #A5D6A7;color:#2E7D32;';
    sp.style.display = 'none';
    tx.textContent = '✅ 원재료·규격 정보 수집 완료! 경쟁사 제품비교 탭을 확인하세요.';
  }
}

async function runSkill() {
  $('btn-run').disabled = true;
  showPage('load');
  $('load-kw').textContent = `FoodnBid에서 "${curKw}" 2025·2024년 수집 중…`;
  $('load-sub').textContent  = '약 10~15분 소요됩니다. 이 페이지를 닫지 마세요.';
  await fetch(`/api/run?keyword=${encodeURIComponent(curKw)}&exclude=${encodeURIComponent(curExclude)}`);
  startPoll();
}

async function reCollect() {
  if (!curKw) return;
  curExclude = $('kw-ex').value.trim();
  const exMsg = curExclude ? `\n검색제외 키워드: "${curExclude}"` : '';
  if (!confirm(`"${curKw}" 데이터를 FoodnBid에서 다시 수집합니다.${exMsg}\n약 5~10분 소요됩니다. 계속하시겠습니까?`)) return;
  $('btn-recollect').disabled = true;
  showPage('load');
  $('load-kw').textContent = `FoodnBid에서 "${curKw}" 2025·2024년 재수집 중…`;
  $('load-sub').textContent  = '약 10~15분 소요됩니다. 이 페이지를 닫지 마세요.';
  await fetch(`/api/run?keyword=${encodeURIComponent(curKw)}&exclude=${encodeURIComponent(curExclude)}`);
  startPoll();
}

function startPoll() {
  if (pollTmr) clearInterval(pollTmr);
  pollTmr = setInterval(async () => {
    try {
      const st = await (await fetch(`/api/status?keyword=${encodeURIComponent(curKw)}`)).json();
      if (st.status === 'done') {
        clearInterval(pollTmr);
        const r = await fetch(`/api/search?keyword=${encodeURIComponent(curKw)}`);
        if (r.ok) {
          G = await r.json(); render(); showPage('dash'); loadPills();
          if ($('btn-recollect')) $('btn-recollect').disabled = false;
        } else {
          alert('수집은 완료됐지만 데이터를 찾지 못했습니다. 키워드를 확인 후 다시 시도해 주세요.');
          showPage('home');
          $('btn-run').disabled = false;
          if ($('btn-recollect')) $('btn-recollect').disabled = false;
        }
      } else if ((st.status||'').startsWith('error')) {
        clearInterval(pollTmr);
        alert('수집 오류: ' + st.status);
        showPage('home');
        if ($('btn-recollect')) $('btn-recollect').disabled = false;
      }
    } catch(e) {}
  }, 8000);
}

function showPage(n) {
  ['home','load','none','dash'].forEach(p => {
    const el = $(`pg-${p}`);
    if (el) el.style.display = (p === n) ? '' : 'none';
  });
}
function showNone(kw, msg) {
  $('none-title').textContent = `"${kw}" 데이터 없음`;
  $('none-msg').textContent   = msg + ' 지금 수집을 시작할까요?';
  $('btn-run').disabled = false;
  showPage('none');
}
function swTab(n) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('on', i===n));
  document.querySelectorAll('.panel').forEach((p,i) => p.classList.toggle('on', i===n));
}

      : `<span style="color:#aaa;font-size:.75rem;">직접 확인</span>`;

    const mavgVal = p.monthly_avg
      ? `${(p.monthly_avg/1e8).toFixed(2)}억원`
      : '—';

    return `
      <div class="prod-card" style="border-top:4px solid ${col};">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
          <span style="background:${col};color:#fff;font-size:.68rem;font-weight:700;
            padding:2px 8px;border-radius:10px;white-space:nowrap;">
            FoodnBid ${year} ${p.rank}위 제품
          </span>
        </div>
        <div style="font-size:.82rem;font-weight:700;color:${col};margin-bottom:2px;">${p.company}</div>
        ${prodName}
        ${imgArea}
        <div style="display:flex;flex-direction:column;gap:2px;">
          <div class="prod-row">
            <span class="prod-k">연간 추정 매출</span>
            <span class="prod-v">${fmtE1(p.annual)}</span>
          </div>
          <div class="prod-row">
            <span class="prod-k">방학제외 월평균</span>
            <span class="prod-v">${mavgVal}</span>
          </div>
          <div class="prod-row">
            <span class="prod-k">규격/중량</span>
            <span class="prod-v">${stdVal}</span>
          </div>
          <div class="prod-row" style="align-items:flex-start;">
            <span class="prod-k" style="flex-shrink:0;">원재료명</span>
            <span class="prod-v" style="text-align:left;max-width:160px;">${ingrVal}</span>
          </div>
          <div class="prod-row">
            <span class="prod-k">블루시스 납품가</span>
            <span class="prod-v">${kpVal}</span>
          </div>
        </div>
      </div>`;
  }).join('');

  $('prod-sec').innerHTML = notice + `<div class="prod-grid">${cards}</div>`;
}

function dlExcel() {
  if (!curKw) return;
  const url = `/api/excel?keyword=${encodeURIComponent(curKw)}`;
  fetch(url).then(r => {
    if (!r.ok) return r.json().then(e => alert(e.message || '엑셀 파일 없음'));
    return r.blob().then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${curKw}_학교급식규모.xlsx`;
      a.click();
    });
  }).catch(() => alert('다운로드 실패'));
}
</script>
